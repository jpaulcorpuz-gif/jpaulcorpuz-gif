# Builds the site and publishes it to GitHub Pages on every push to the
# repository's default branch (and on demand from the Actions tab).
#
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - id: pages
        uses: actions/configure-pages@v5

      # base_path is '/<repo-name>' for a project site and '' for a user site
      # or custom domain; Vite needs it with a trailing slash.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # Pages serves 404.html for unknown paths, so deep links like /projects
      # load the app and the router takes it from there.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
